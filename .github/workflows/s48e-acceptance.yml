name: S48e first evening acceptance

on:
  pull_request:
    paths:
      - 'src/karst41/**'
      - 'scripts/accept_s48e_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - '.github/workflows/s48e-acceptance.yml'
  workflow_dispatch:

jobs:
  s48e-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        tier: ['16', '256', 'truecolor']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/s48e/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/s48e/venv"
          "$RUNNER_TEMP/karst41-proof/s48e/venv/bin/python" -m pip install "$RUNNER_TEMP"/karst41-proof/s48e/wheels/*.whl
      - name: One whole evening, and Vesper by jack after skipping every lesson
        shell: bash
        run: |
          python scripts/accept_s48e_netbbs.py --root "$RUNNER_TEMP/karst41-proof/s48e/captures" --door-python "$RUNNER_TEMP/karst41-proof/s48e/venv/bin/python" --size '${{ matrix.size }}' --tier '${{ matrix.tier }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s48e-${{ matrix.size }}-${{ matrix.tier }}
          path: |
            ${{ runner.temp }}/karst41-proof/s48e/captures/*.ans
            ${{ runner.temp }}/karst41-proof/s48e/captures/*.txt
            ${{ runner.temp }}/karst41-proof/s48e/captures/*.json
            ${{ runner.temp }}/karst41-proof/s48e/captures/failure-trace.txt
            ${{ runner.temp }}/karst41-proof/s48e/captures/progress.log
      - name: Remove native proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/s48e"
